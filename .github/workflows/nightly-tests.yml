name: Nightly Playwright Tests

on:
  schedule:
    # Runs at 2 AM UTC every night (8 PM PST / 9 PM PDT)
    - cron: '0 2 * * *'
  # Allows manual triggering from Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      id: playwright
      continue-on-error: true
      env:
        PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
      run: npx playwright test specs/nightly/ --reporter=html,json

    - name: Parse test results
      id: results
      if: always()
      run: |
        if [ -f results.json ]; then
          PASSED=$(jq '.stats.expected' results.json)
          FAILED=$(jq '.stats.unexpected' results.json)
          FLAKY=$(jq '.stats.flaky' results.json)
          DURATION_MS=$(jq '.stats.duration' results.json)
          MINS=$(( DURATION_MS / 60000 ))
          SECS=$(( (DURATION_MS % 60000) / 1000 ))
          SUMMARY="${PASSED} passed"
          [ "$FAILED" -gt 0 ] && SUMMARY="${SUMMARY} · ${FAILED} failed"
          [ "$FLAKY" -gt 0 ] && SUMMARY="${SUMMARY} · ${FLAKY} flaky"
          SUMMARY="${SUMMARY} | ⏱ ${MINS}m${SECS}s"
        else
          SUMMARY="results unavailable"
        fi
        echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

    - name: Upload test report artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Deploy report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report

    - name: Notify Slack
      if: always()
      uses: slackapi/slack-github-action@v1.25.0
      with:
        payload: |
          {
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "${{ steps.playwright.outcome == 'success' && '✅' || '❌' }} *Nightly LMS Tests* — StormWind\n${{ steps.results.outputs.summary }}\n<https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/|📊 View HTML Report>  ·  <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Fail job if tests failed
      if: steps.playwright.outcome == 'failure'
      run: exit 1
